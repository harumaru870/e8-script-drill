<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Drill</title>
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e2e2e0;
  --acc:#1f5c6b; --acc-soft:#e3eef0; --ok:#2e7d4f; --ng:#b3412e; --mask:#d9dcdf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141516; --card:#1e2022; --ink:#ececec; --sub:#9a9ca0; --line:#2e3134;
    --acc:#6fb3c4; --acc-soft:#1f3337; --ok:#6cc290; --ng:#e8836f; --mask:#3a3e42;
  }
}
:root[data-theme="dark"]{
  --bg:#141516; --card:#1e2022; --ink:#ececec; --sub:#9a9ca0; --line:#2e3134;
  --acc:#6fb3c4; --acc-soft:#1f3337; --ok:#6cc290; --ng:#e8836f; --mask:#3a3e42;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0}
.seg button:last-child{border-right:0}
button,select{font:inherit;font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stat{font-size:13px;color:var(--sub);margin-left:auto}
main{padding:12px 16px 80px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:12px 14px}
section h2{font-size:15px;margin:0 0 6px;color:var(--acc)}
.card{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.card span{font-size:12px;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:1px 7px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:8px 6px;border-radius:8px;border-left:3px solid transparent}
.row.cur{background:var(--acc-soft)}
.row.ok{border-left-color:var(--ok)} .row.ng{border-left-color:var(--ng)}
.num{font-size:12px;color:var(--sub);padding-top:3px}
.en{cursor:pointer;word-break:break-word}
.en .w{border-radius:3px}
.hidden .en .w{color:transparent;background:var(--mask)}
.hint .en .w{color:transparent;background:var(--mask)}
.hint .en .w::first-letter{color:var(--ink)}
.hint .en .w{display:inline-block;background:linear-gradient(var(--mask),var(--mask)) no-repeat 0 100%/100% 35%}
.ja{font-size:13px;color:var(--sub);margin-top:2px}
.noja .ja{display:none}
.tools{display:flex;gap:4px}
.tools button{padding:3px 8px}
.full{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
audio{height:32px;max-width:100%}
.help{font-size:12px;color:var(--sub);margin-top:6px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--card)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>How to Avoid Being a Bad Tourist — 1文ずつ暗記ドリル</h1>
  <div class="bar">
    <div class="seg" id="mode">
      <button data-m="hidden" class="on">全部隠す</button>
      <button data-m="hint">頭文字</button>
      <button data-m="show">全部表示</button>
    </div>
    <button id="jaBtn" class="on">日本語訳</button>
    <button id="ngOnly">✗だけ</button>
    <button id="auto">連続再生</button>
    <select id="rate" aria-label="再生速度">
      <option value="0.8">0.8×</option><option value="0.9">0.9×</option>
      <option value="1" selected>1.0×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option>
    </select>
    <button id="reset">リセット</button>
    <span class="stat" id="stat"></span>
  </div>
  <div class="full"><span style="font-size:13px;color:var(--sub)">全文通し</span><span style="font-size:12px;color:var(--sub)">音声: Google Chirp 3 HD (Charon)</span><audio id="fullAudio" controls preload="none" src="audio/full.m4a"></audio></div>
  <div class="help">文をタップで表示/非表示 ・ <kbd>Space</kbd> 表示 ・ <kbd>↓</kbd>/<kbd>↑</kbd> 次/前 ・ <kbd>P</kbd> 再生 ・ <kbd>O</kbd> 言えた ・ <kbd>X</kbd> 言えなかった</div>
</div></header>
<main><div class="wrap" id="list"></div></main>
<audio id="one" preload="none"></audio>
<script>
const DATA = [{"n": 1, "title": "Title", "en": ["Good morning, everyone.", "My name is Haruhiro Seki.", "I am a second-year student at Ritsumeikan University.", "Today, I'd like to talk about how to avoid being a bad tourist.", "In Kyoto, we see tourists every day, so this topic is close to all of us.", "The purpose of this presentation is to show you how to travel without making problems for the people who live there.", "This presentation should take about seven to eight minutes."], "ja": ["皆さん、おはようございます。", "Haruhiro Sekiです。", "立命館大学の2回生です。", "今日は「悪い観光客にならない方法」についてお話しします。", "京都では毎日観光客を目にするので、このテーマは私たち全員にとって身近なものです。", "このプレゼンの目的は、そこに住んでいる人たちに迷惑をかけずに旅行する方法をお見せすることです。", "このプレゼンは7〜8分ほどかかる予定です。"], "card": ["morning", "Ritsumeikan", "second-year", "Kyoto", "purpose", "problems", "people", "live", "7–8", "minutes"]}, {"n": 2, "title": "Overview", "en": ["I would like to show you four important steps.", "First, I will show you how to learn local rules.", "Then, I will show you how to respect local culture.", "Next, I will show you how to communicate with local people.", "And finally, I will show you how to protect the places you visit.", "Please feel free to ask me questions at the end of my presentation.", "Okay. Let me begin with local rules."], "ja": ["4つの大切なステップを紹介します。", "まず、現地のルールを知る方法をお見せします。", "次に、現地の文化を尊重する方法をお見せします。", "その次に、現地の人とコミュニケーションをとる方法をお見せします。", "そして最後に、訪れる場所を守る方法をお見せします。", "質問があれば、プレゼンの最後に遠慮なくどうぞ。", "では、現地のルールから始めましょう。"], "card": ["important", "steps", "first", "then", "next", "finally", "questions", "end", "begin"]}, {"n": 3, "title": "Learn Local Rules (1)", "en": ["The first step is to learn local rules.", "The best time to do this is before you go.", "Rules are different in every country.", "For example, in Singapore, you have to pay a fine if you eat or drink on the subway.", "In Japan, many temples do not allow photos inside.", "Please look at Section 1 on your handout.", "This is a checklist for before your trip.", "You can use it for your next trip.", "Now, please look back at the slides.", "When you arrive, read the signs.", "Signs at stations, parks and tourist spots tell you where you can eat, smoke, and take photos."], "ja": ["最初のステップは、現地のルールを知ることです。", "これをするのに一番いいタイミングは、出発する前です。", "ルールは国によって違います。", "たとえばシンガポールでは、地下鉄で飲食をすると罰金を払わなければなりません。", "日本では、多くのお寺が建物の中での撮影を禁止しています。", "ハンドアウトのSection 1を見てください。", "これは旅行前のチェックリストです。", "次の旅行で使ってみてください。", "では、スライドに戻ってください。", "現地に着いたら、看板を読みましょう。", "駅や公園、観光地の看板には、どこで食べてよいか、たばこを吸ってよいか、写真を撮ってよいかが書いてあります。"], "card": ["Singapore", "subway", "fine", "temples", "inside", "handout", "checklist", "stations", "smoke"]}, {"n": 4, "title": "Learn Local Rules (2)", "en": ["Rules on trains are very important.", "According to a 2024 survey by the Japan Private Railway Association, reported by SoraNews24 on December 30th, 2024, 62.9 percent of Japanese train users were unhappy with the manners of foreign tourists.", "The survey asked 5,314 people.", "So, please keep your voice low, especially on crowded trains.", "Also, if you are not sure about a rule, just ask the station staff.", "A simple question is better than breaking a rule by mistake.", "So up to now, I have talked about local rules.", "Next, let's move from rules to culture."], "ja": ["電車でのルールはとても大切です。", "日本民営鉄道協会が2024年に行い、SoraNews24が2024年12月30日に報じた調査によると、日本の電車利用者の62.9%が外国人観光客のマナーに不満を感じていました。", "この調査は5,314人に聞いたものです。", "ですから、特に混んでいる電車では、声を小さくしてください。", "また、ルールがよくわからないときは、駅員さんに聞いてみてください。", "うっかりルールを破るより、ちょっと質問するほうがずっといいです。", "ここまで、現地のルールについてお話ししました。", "次は、ルールから文化へ移りましょう。"], "card": ["association", "December", "5,314", "foreign", "unhappy", "mistake", "culture"]}, {"n": 5, "title": "Respect Local Culture (1)", "en": ["The second step is to respect local culture.", "First, remember that customs can be very different from your home country.", "For example, Japanese people bow, but in many Western countries, people shake hands.", "Table manners are different, too.", "In Japan, you should not stand your chopsticks up in a bowl of rice.", "Second, follow dress rules at temples and churches.", "Many temples in Thailand and churches in Italy ask visitors to cover their shoulders and knees."], "ja": ["2つ目のステップは、現地の文化を尊重することです。", "まず、習慣は自分の国とまったく違うことがある、ということを覚えておいてください。", "たとえば、日本人はお辞儀をしますが、多くの欧米の国では握手をします。", "テーブルマナーも違います。", "日本では、ご飯に箸を立ててはいけません。", "次に、お寺や教会では服装のルールを守りましょう。", "タイの多くのお寺やイタリアの多くの教会では、訪問者に肩とひざを隠すよう求めています。"], "card": ["bow", "handshake", "chopsticks", "rice", "Thailand", "Italy", "shoulders", "knees"]}, {"n": 6, "title": "Respect Local Culture (2)", "en": ["Next, always ask before you take photos of people.", "In the Gion area of Kyoto, there are signs that say \"no photos\" on private streets.", "This is because some tourists followed maiko with their cameras.", "Finally, respect traditions, even if they look strange to you.", "Please do not laugh at a custom just because it is new to you.", "Respecting culture is important, and good communication also helps us connect with local people."], "ja": ["それから、人の写真を撮る前には必ず聞きましょう。", "京都の祇園では、私道に「撮影禁止」の看板があります。", "これは、一部の観光客がカメラを持って舞妓さんを追いかけたからです。", "最後に、伝統が自分には奇妙に見えても、尊重しましょう。", "自分にとって新しいからというだけで、習慣を笑わないでください。", "文化を尊重することは大切です。そして、よいコミュニケーションも現地の人とつながる助けになります。"], "card": ["Gion", "private", "streets", "maiko", "cameras", "strange", "new", "connect"]}, {"n": 7, "title": "Communicate with Local People (1)", "en": ["The third step is to communicate with local people.", "You don't need to speak the language well.", "Just learn a few simple, polite words like hello, thank you and excuse me.", "Please look at Section 2 on your handout.", "It shows these three words in six languages.", "Even one word, like \"arigatou\" in Japan or \"merci\" in France, can make people smile.", "Now, please look back at the slides.", "You can also ask local people for advice.", "They know the best restaurants."], "ja": ["3つ目のステップは、現地の人とコミュニケーションをとることです。", "その言語を上手に話せなくても大丈夫です。", "「こんにちは」「ありがとう」「すみません」のような、簡単で丁寧な言葉をいくつか覚えるだけでいいのです。", "ハンドアウトのSection 2を見てください。", "この3つの言葉が6つの言語で載っています。", "日本での「ありがとう」やフランスでの「メルシー」のように、たった一言でも人を笑顔にできます。", "では、スライドに戻ってください。", "現地の人にアドバイスを求めるのもいいでしょう。", "おいしいレストランをよく知っています。"], "card": ["speak", "handout", "six", "languages", "arigatou", "merci", "smile", "restaurants"]}, {"n": 8, "title": "Communicate with Local People (2)", "en": ["When you talk, speak slowly and clearly, and use simple words.", "Listen carefully, too.", "When it is hard to understand each other, use a translation app.", "You can say your question and show the answer on your phone.", "My tip is to download the offline language data before you go, because there may be no Wi-Fi in a small town.", "That completes the third step.", "Finally, let's look at how to protect the places we visit."], "ja": ["話すときは、ゆっくりはっきり、簡単な言葉を使いましょう。", "相手の話もよく聞きましょう。", "お互いに理解するのが難しいときは、翻訳アプリを使いましょう。", "質問を話しかけて、答えをスマホの画面で見せることができます。", "私のおすすめは、出発前にオフライン用の言語データをダウンロードしておくことです。小さな町ではWi-Fiがないかもしれないからです。", "これで3つ目のステップは終わりです。", "最後に、訪れる場所を守る方法を見ていきましょう。"], "card": ["download", "Wi-Fi", "town", "tip", "phone", "completes", "protect"]}, {"n": 9, "title": "Protect the Places You Visit (1)", "en": ["The fourth step is to protect the places you visit.", "First, take your trash with you.", "In Japan, there are very few trash bins on the street, so carry a small bag for your trash.", "This chart shows a 2019 Japan Tourism Agency survey of 138 towns, reported by The Japan Times.", "About 20 percent of these towns said trash from tourists was a problem.", "Please look at Section 3 on your handout.", "In 2024, 1.4 billion people traveled to another country.", "More visitors means more trash.", "Now, please look back at the slides.", "Also, bring your own bottle and shopping bag.", "This is an easy way to use less plastic."], "ja": ["4つ目のステップは、訪れる場所を守ることです。", "まず、ゴミは持ち帰りましょう。", "日本では道にゴミ箱がとても少ないので、ゴミ用の小さな袋を持ち歩きましょう。", "このグラフは、観光庁が2019年に138の市町村に行い、ジャパンタイムズが報じた調査です。", "約20%の市町村が、観光客のゴミが問題だと答えました。", "ハンドアウトのSection 3を見てください。", "2024年には14億人が外国へ旅行しました。", "訪れる人が増えれば、ゴミも増えます。", "では、スライドに戻ってください。", "また、自分のボトルと買い物袋を持っていきましょう。", "プラスチックを減らす簡単な方法です。"], "card": ["bins", "2019", "138", "towns", "20", "handout", "billion", "trash", "plastic"]}, {"n": 10, "title": "Protect the Places You Visit (2)", "en": ["Second, stay on the paths.", "Walking off the path can hurt plants.", "Leave wild animals alone.", "For example, in Nara, deer sometimes bite or kick people who tease them with food.", "Last, save energy at your hotel.", "Turn off the lights and the air conditioner when you go out.", "Now, let me summarize these four steps."], "ja": ["次に、道から外れないようにしましょう。", "道から外れて歩くと植物を傷めることがあります。", "野生動物にはかまわないでください。", "たとえば奈良では、食べ物でからかった人をシカがかんだり蹴ったりすることがあります。", "最後に、ホテルでは省エネをしましょう。", "出かけるときは電気とエアコンを消してください。", "では、この4つのステップをまとめます。"], "card": ["off", "hurt", "Nara", "deer", "bite", "tease", "hotel", "summarize"]}, {"n": 11, "title": "Summary", "en": ["First, learn local rules: check them before you go, read the signs, and keep your voice low on trains.", "Second, respect local culture: customs are different, so follow dress rules and ask before taking photos.", "Third, communicate with local people: simple polite words, clear speech and a translation app will help you.", "Finally, protect the places you visit: take your trash, protect nature and save energy."], "ja": ["1つ目は、現地のルールを知ること。出発前に調べ、看板を読み、電車では声を小さくしましょう。", "2つ目は、現地の文化を尊重すること。習慣は違うので、服装のルールを守り、写真を撮る前に聞きましょう。", "3つ目は、現地の人とコミュニケーションをとること。簡単で丁寧な言葉、はっきりした話し方、翻訳アプリが助けになります。", "最後に、訪れる場所を守ること。ゴミを持ち帰り、自然を守り、エネルギーを節約しましょう。"], "card": ["before", "go", "voice", "dress", "photos", "polite"]}, {"n": 12, "title": "Final comment", "en": ["Now you are ready to be a good tourist.", "Before your next trip, please use the checklist and the links on your handout.", "Enjoy your trip, but remember: your destination is someone else's home.", "Thank you for listening.", "Any questions?"], "ja": ["これで皆さんは、よい観光客になる準備ができました。", "次の旅行の前に、ハンドアウトのチェックリストとリンクを使ってみてください。", "旅行を楽しんでください。でも覚えておいてください。あなたの旅先は、誰かの家なのです。", "ご清聴ありがとうございました。", "何か質問はありますか？"], "card": ["ready", "good", "handout", "checklist", "links", "enjoy", "trip", "listening", "repeat", "confirm"]}];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let marks = store.get("drill-marks", {});
let mode = store.get("drill-mode", "hidden");
let showJa = store.get("drill-ja", true);
let ngOnly = false, auto = false, cur = 0;
const rows = [], one = document.getElementById("one");

const list = document.getElementById("list");
DATA.forEach(s => {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>Slide ${s.n} — ${s.title}</h2>` +
    (s.card.length ? `<div class="card" title="ノートカード">${s.card.map(w => `<span>${w}</span>`).join("")}</div>` : "");
  s.en.forEach((t, i) => {
    const id = `s${String(s.n).padStart(2,"0")}_${String(i+1).padStart(2,"0")}`;
    const r = document.createElement("div");
    r.className = "row"; r.dataset.id = id;
    r.innerHTML = `<div class="num">${s.n}-${i+1}</div>
      <div><div class="en">${t.split(" ").map(w => `<span class="w">${w}</span>`).join(" ")}</div><div class="ja">${s.ja[i]}</div></div>
      <div class="tools"><button data-a="play" aria-label="再生">▶</button><button data-a="ok" aria-label="言えた">○</button><button data-a="ng" aria-label="言えなかった">✗</button></div>`;
    r.querySelector(".en").onclick = () => { select(rows.indexOf(r)); toggle(r); };
    r.querySelector('[data-a="play"]').onclick = () => { select(rows.indexOf(r)); play(r); };
    r.querySelector('[data-a="ok"]').onclick = () => mark(r, "ok");
    r.querySelector('[data-a="ng"]').onclick = () => mark(r, "ng");
    sec.appendChild(r); rows.push(r);
  });
  list.appendChild(sec);
});

function applyRow(r){
  r.classList.remove("hidden","hint","ok","ng");
  const open = !!r.dataset.open;
  if (mode !== "show" && !open) r.classList.add(mode);
  if (mode === "show" && open) r.classList.add("hidden");
  if (marks[r.dataset.id]) r.classList.add(marks[r.dataset.id]);
  r.style.display = ngOnly && marks[r.dataset.id] !== "ng" ? "none" : "";
}
function render(){
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  document.getElementById("jaBtn").classList.toggle("on", showJa);
  document.body.classList.toggle("noja", !showJa);
  document.getElementById("ngOnly").classList.toggle("on", ngOnly);
  document.getElementById("auto").classList.toggle("on", auto);
  rows.forEach(applyRow);
  const v = Object.values(marks);
  document.getElementById("stat").textContent = `○ ${v.filter(x=>x==="ok").length} ・ ✗ ${v.filter(x=>x==="ng").length} / ${rows.length}文`;
}
function toggle(r){ r.dataset.open = r.dataset.open ? "" : "1"; applyRow(r); }
function mark(r, m){ marks[r.dataset.id] = marks[r.dataset.id] === m ? undefined : m; store.set("drill-marks", marks); render(); }
function visible(){ return rows.filter(r => r.style.display !== "none"); }
function select(i){
  rows.forEach(r => r.classList.remove("cur"));
  cur = Math.max(0, Math.min(rows.length - 1, i));
  rows[cur].classList.add("cur");
  rows[cur].scrollIntoView({block:"center", behavior:"smooth"});
}
function step(d){
  const v = visible(); if (!v.length) return;
  let k = v.indexOf(rows[cur]); k = k < 0 ? 0 : Math.max(0, Math.min(v.length - 1, k + d));
  select(rows.indexOf(v[k]));
}
function play(r){
  one.src = `audio/${r.dataset.id}.m4a`;
  one.playbackRate = +document.getElementById("rate").value;
  one.play().catch(()=>{});
}
one.onended = () => {
  if (!auto) return;
  const v = visible(), k = v.indexOf(rows[cur]);
  if (k >= 0 && k < v.length - 1) setTimeout(() => { step(1); play(rows[cur]); }, 1500);
};

document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
  mode = b.dataset.m; store.set("drill-mode", mode);
  rows.forEach(r => r.dataset.open = ""); render();
});
document.getElementById("jaBtn").onclick = () => { showJa = !showJa; store.set("drill-ja", showJa); render(); };
document.getElementById("ngOnly").onclick = () => { ngOnly = !ngOnly; render(); };
document.getElementById("auto").onclick = () => { auto = !auto; render(); };
document.getElementById("rate").onchange = e => { one.playbackRate = +e.target.value; document.getElementById("fullAudio").playbackRate = +e.target.value; };
document.getElementById("reset").onclick = () => { if (confirm("○✗の記録を消しますか？")) { marks = {}; store.set("drill-marks", marks); render(); } };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  const r = rows[cur];
  if (e.key === " ") { e.preventDefault(); toggle(r); }
  else if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
  else if (e.key === "p") play(r);
  else if (e.key === "o") { mark(r, "ok"); step(1); }
  else if (e.key === "x") { mark(r, "ng"); step(1); }
});
render(); select(0);
</script>
</body>
</html>
